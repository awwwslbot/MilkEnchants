name: "<gradient:#FFD166:#EF476F>连射"

# 附魔描述，显示在附魔查询页面(GUI)的lore中，支持 Bukkit 颜色代码与 MiniMessage
description:
  - "&f拉满后自动发射，并继续下一轮蓄力"
  - "&7可用于：&e弓"
  - "&d最高等级：1"
  - "&c此附魔超载提升等级无任何收益"

# 最高等级
max_level: 1
# 铁砧基础等级开销
anvil_cost: 4

# 附魔台获取规则
enchanting_table:
  enabled: true
  chance: 0.01
  min_cost: 30
  max_cost: 30

# 村民交易获取规则
villager_trades:
  enabled: false
  chance: 0.01
  treasure: true

# 可应用物品：仅弓
applicable_items: BOW

# 开始拉弓时启动自动连射
trigger: RIGHT_CLICK
target: SELF
cooldown: 0

actions:
  auto:
    type: auto_bow
    # 拉满后自动发射，不改变蓄力速度
    refire: true
    # 两轮之间的间隔（tick）
    refire_delay: 0
    # 0 = 不限次数，直到玩家松手/切物品
    max_shots: 0
